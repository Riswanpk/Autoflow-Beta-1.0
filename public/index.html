<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Water Can Booking</title>
  <style>
    body{font-family:Arial;background:#f5f7fb;margin:0}.card{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}.row{display:flex;gap:10px;align-items:center}.row button{width:48px}button{width:100%;padding:14px;border:0;border-radius:10px;background:#1683ff;color:#fff;font-size:16px}.row input{flex:1}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 16px;border:1px solid #ddd;border-radius:8px}.line{display:flex;justify-content:space-between;margin:9px 0}.total{font-size:20px;font-weight:bold}
  </style>
</head>
<body>
  <div class="card">
    <h2>Book Water Cans</h2>
    <label for="cans">Number of cans</label>
    <div class="row"><button onclick="change(-1)">-</button><input id="cans" type="number" min="1" max="20" value="1" oninput="refresh()"><button onclick="change(1)">+</button></div>
    <label for="address">Delivery address</label>
    <textarea id="address" rows="4" placeholder="House / flat, street, area"></textarea>
    <h3>Price</h3>
    <div class="line"><span>Water cans</span><span id="base">₹0</span></div>
    <div class="line"><span>Platform fee allocation</span><span id="pf">₹0</span></div>
    <hr><div class="line total"><span>Total</span><span id="total">₹0</span></div>
    <button onclick="pay()">Pay with PayU</button><p id="msg"></p>
  </div>
  <script>
    const ref=new URLSearchParams(location.search).get('ref');let timer;
    async function refresh(){clearTimeout(timer);timer=setTimeout(async()=>{const cans=Number(document.getElementById('cans').value||1);const response=await fetch('/api/pricing?cans='+cans);const price=await response.json();document.getElementById('base').textContent='₹'+price.base;document.getElementById('pf').textContent='₹'+price.pfee;document.getElementById('total').textContent='₹'+price.total},100)}
    function change(amount){const input=document.getElementById('cans');input.value=Math.max(1,Math.min(20,Number(input.value)+amount));refresh()}
    async function pay(){const message=document.getElementById('msg');const address=document.getElementById('address').value.trim();if(address.length<8){message.textContent='Enter a proper delivery address';return}const cans=Number(document.getElementById('cans').value);let response=await fetch('/api/order/'+ref,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cans,address})});let result=await response.json();if(!response.ok){message.textContent=result.error;return}response=await fetch('/api/order/'+ref+'/pay',{method:'POST'});result=await response.json();if(!response.ok){message.textContent=result.error+': '+JSON.stringify(result.details||'');return}if(result.payment_url){location.href=result.payment_url}else{message.textContent='No PayU payment URL was returned.'}}
    refresh();
  </script>
</body>
</html>
