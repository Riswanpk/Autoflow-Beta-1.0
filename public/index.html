<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Water Can Booking</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.card{max-width:480px;margin:40px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}button{width:100%;padding:14px;border:0;border-radius:10px;background:#1683ff;color:white;font-size:16px}.row{display:flex;gap:10px;align-items:center}.row button{width:48px}.row input{flex:1}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 16px;border:1px solid #ddd;border-radius:8px}.total{font-size:20px;font-weight:bold}.line{display:flex;justify-content:space-between;margin:9px 0}</style></head><body><div class="card"><h2>💧 Book Water Cans</h2><label>Number of cans</label><div class="row"><button onclick="change(-1)">−</button><input id="cans" type="number" min="1" max="20" value="1" oninput="refresh()"><button onclick="change(1)">+</button></div><label>Delivery address</label><textarea id="address" rows="4" placeholder="House / flat, street, area"></textarea><h3>Price</h3><div class="line"><span>Water cans</span><span id="base">₹0</span></div><div class="line"><span>Decentro fee</span><span id="df">₹0</span></div><div class="line"><span>Platform fee (2%)</span><span id="pf">₹0</span></div><hr><div class="line total"><span>Total</span><span id="total">₹0</span></div><button onclick="pay()">Pay with UPI</button><p id="msg"></p></div><script>const ref=new URLSearchParams(location.search).get('ref');let timer;async function refresh(){clearTimeout(timer);timer=setTimeout(async()=>{const cans=Number(document.getElementById('cans').value||1);const r=await fetch('/api/pricing?cans='+cans);const p=await r.json();document.getElementById('base').textContent='₹'+p.base;document.getElementById('df').textContent='₹'+p.dfee;document.getElementById('pf').textContent='₹'+p.pfee;document.getElementById('total').textContent='₹'+p.total},100)}function change(n){const x=document.getElementById('cans');x.value=Math.max(1,Math.min(20,Number(x.value)+n));refresh()}async function pay(){const address=document.getElementById('address').value.trim();if(address.length<8){msg.textContent='Enter a proper delivery address';return}const cans=Number(document.getElementById('cans').value);let r=await fetch('/api/order/'+ref,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cans,address})});let j=await r.json();if(!r.ok){msg.textContent=j.error;return}r=await fetch('/api/order/'+ref+'/pay',{method:'POST'});j=await r.json();if(!r.ok){msg.textContent=j.error+': '+JSON.stringify(j.details||'');return}const u=j.upi_uris||{};const url=u.common_uri||u.gpay_uri||u.phonepe_uri;if(url){location.href=url}else{msg.textContent='Payment link created, but no UPI URI was returned. Check the server log.'}}refresh();</script></body></html>
