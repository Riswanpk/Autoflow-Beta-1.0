<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Payment status</title><style>body{font-family:Arial;background:#f5f7fb}.card{max-width:440px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;text-align:center;box-shadow:0 4px 20px #0001}a{display:block;margin-top:18px;padding:13px;border-radius:10px;text-decoration:none;background:#1683ff;color:#fff}</style></head><body><div class="card"><div id="icon" style="font-size:60px">…</div><h1 id="title">Checking payment</h1><p id="body">Please wait.</p><a id="wa" href="#">Return to WhatsApp</a></div><script>(async()=>{const ref=new URLSearchParams(location.search).get('ref');const r=await fetch('/api/checkout/'+encodeURIComponent(ref));const o=await r.json();const paid=o.payment_status==='PAID';document.getElementById('icon').textContent=paid?'✅':'⚠️';document.getElementById('title').textContent=paid?'Payment successful':'Payment not confirmed';document.getElementById('body').textContent=paid?'Your water-can order has been received.':'We could not confirm this payment. Please contact support before trying again.';document.getElementById('wa').href='https://wa.me/'+encodeURIComponent(o.phone)+'?text='+encodeURIComponent((paid?'Payment complete':'Payment status')+' for order '+ref);})();</script></body></html>
