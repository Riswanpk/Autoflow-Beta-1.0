<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>Success</title><style>body{font-family:Arial;background:#f5f7fb}.card{max-width:440px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;text-align:center;box-shadow:0 4px 20px #0001}a{display:block;margin-top:18px;padding:13px;border-radius:10px;text-decoration:none;background:#1683ff;color:#fff}</style></head><body><div class="card"><div style="font-size:60px">✅</div><h1>Payment successful</h1><p>Your water-can order has been received.</p><a id="wa" href="#">Return to WhatsApp</a></div><script>(async()=>{const ref=new URLSearchParams(location.search).get('ref');const r=await fetch('/api/checkout/'+encodeURIComponent(ref));const o=await r.json();document.getElementById('wa').href='https://wa.me/'+encodeURIComponent(o.phone)+'?text='+encodeURIComponent('Payment complete for order '+ref);})();</script></body></html>
