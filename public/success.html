<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width">
	<title>Payment status</title>
	<style>
		body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}
		.card{max-width:440px;margin:80px auto;background:#fff;padding:30px;border-radius:18px;text-align:center;box-shadow:0 4px 20px #0001}
		.icon{font-size:60px}
		h1{margin:16px 0 10px}
		p{line-height:1.5;color:#536078}
		.details{margin:22px 0;padding:14px;background:#f5f7fb;border-radius:10px}
		.details div{display:flex;justify-content:space-between;margin:7px 0}
		a{display:block;margin-top:18px;padding:13px;border-radius:10px;text-decoration:none;background:#1683ff;color:#fff}
	</style>
</head>
<body>
	<main class="card">
		<div id="icon" class="icon">...</div>
		<h1 id="title">Checking payment</h1>
		<p id="body">Please wait while we confirm your payment.</p>
		<div id="details" class="details" hidden>
			<div><span>Order</span><strong id="order"></strong></div>
			<div><span>Amount paid</span><strong id="amount"></strong></div>
		</div>
		<p id="notice" hidden>We have sent the payment update to your WhatsApp number.</p>
	</main>
	<script>
		(async()=>{
			const ref=new URLSearchParams(location.search).get('ref');
			const icon=document.getElementById('icon');
			const title=document.getElementById('title');
			const body=document.getElementById('body');
			const details=document.getElementById('details');
			const notice=document.getElementById('notice');
			try{
				if(!ref) throw new Error('Missing order reference');
				const response=await fetch('/api/checkout/'+encodeURIComponent(ref));
				if(!response.ok) throw new Error('Order lookup failed');
				const order=await response.json();
				const paid=order.payment_status==='PAID';
				icon.textContent=paid?'✅':'⚠️';
				title.textContent=paid?'Payment successful':'Payment not confirmed';
				body.textContent=paid?'Your payment was received successfully. Your water-can order has been confirmed.':'Your payment was not successful. No amount was confirmed. Please try again.';
				notice.hidden=false;
				if(paid){
					document.getElementById('order').textContent=order.id;
					document.getElementById('amount').textContent='₹'+(order.pricing?.total||0);
					details.hidden=false;
				}
			}catch(error){
				icon.textContent='⚠️';
				title.textContent='Payment status unavailable';
				body.textContent='We could not check the payment status. Please contact support with your order reference.';
				notice.hidden=true;
			}
		})();
	</script>
</body>
</html>
